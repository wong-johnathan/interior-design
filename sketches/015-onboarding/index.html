<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onboarding Flow</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white font-['Inter',system-ui,sans-serif] min-h-screen flex items-center justify-center p-6">
  <div class="max-w-2xl w-full">
    <!-- Step indicator -->
    <div class="flex items-center justify-center gap-2 mb-10">
      <div class="w-3 h-3 bg-teal-500 rounded-full"></div>
      <div class="w-12 h-0.5 bg-teal-500/50"></div>
      <div class="w-3 h-3 bg-slate-600 rounded-full"></div>
      <div class="w-12 h-0.5 bg-slate-700"></div>
      <div class="w-3 h-3 bg-slate-600 rounded-full"></div>
      <div class="w-12 h-0.5 bg-slate-700"></div>
      <div class="w-3 h-3 bg-slate-600 rounded-full"></div>
    </div>

    <!-- Step 1: Welcome -->
    <div class="text-center">
      <div class="text-6xl mb-6">🏡</div>
      <h1 class="text-3xl font-bold mb-3">Welcome to HDB Design Studio</h1>
      <p class="text-slate-400 text-lg mb-2">Design your dream HDB home in 4 easy steps.</p>
      <p class="text-slate-500 text-sm mb-8">No design experience needed. Let's get started!</p>

      <button class="bg-teal-600 text-white px-8 py-3 rounded-xl text-lg font-medium hover:bg-teal-500 transition">Let's Go →</button>

      <div class="mt-6 text-xs text-slate-500">
        <button class="hover:text-slate-300">Skip tutorial</button>
      </div>
    </div>

    <!-- Step 2: BTO Selection (hidden initially) 
    <div class="text-center hidden">
      <div class="text-6xl mb-6">📋</div>
      <h2 class="text-2xl font-bold mb-3">Step 1: Find Your BTO</h2>
      <p class="text-slate-400 mb-6">Search for your BTO project by name. We have layouts for all recent launches.</p>
      <div class="bg-slate-800 rounded-xl p-4 inline-block">
        <div class="flex items-center gap-3 bg-slate-700 rounded-lg px-4 py-3 w-80">
          <span>🔍</span>
          <span class="text-slate-300">Search BTO project name...</span>
        </div>
      </div>
    </div>
    -->

    <!-- Step previews at bottom -->
    <div class="grid grid-cols-3 gap-4 mt-12">
      <div class="bg-slate-800/50 rounded-xl p-4 text-center border border-slate-700/50">
        <div class="text-3xl mb-2">📋</div>
        <div class="text-xs font-medium text-slate-300">1. Select BTO</div>
        <div class="text-[10px] text-slate-500 mt-1">Pick your project</div>
      </div>
      <div class="bg-slate-800/50 rounded-xl p-4 text-center border border-slate-700/50">
        <div class="text-3xl mb-2">💬</div>
        <div class="text-xs font-medium text-slate-300">2. AI Chat</div>
        <div class="text-[10px] text-slate-500 mt-1">Describe your style</div>
      </div>
      <div class="bg-slate-800/50 rounded-xl p-4 text-center border border-slate-700/50">
        <div class="text-3xl mb-2">🖼️</div>
        <div class="text-xs font-medium text-slate-300">3. Preview & Render</div>
        <div class="text-[10px] text-slate-500 mt-1">See your design</div>
      </div>
    </div>

    <!-- Skip link -->
    <div class="text-center mt-8">
      <button class="text-xs text-slate-600 hover:text-slate-400">I know what I'm doing — skip to studio →</button>
    </div>
  </div>
</body>
</html>
