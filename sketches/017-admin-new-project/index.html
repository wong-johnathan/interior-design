<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - New BTO Project Flow</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-800 text-white font-['Inter',system-ui,sans-serif] h-screen flex flex-col overflow-hidden">
  <!-- Admin Top Bar -->
  <div class="flex items-center justify-between px-4 py-2 bg-slate-900 border-b border-slate-700 shrink-0">
    <div class="flex items-center gap-3">
      <span class="text-sm font-bold text-amber-400">⚙️ Admin Panel</span>
      <span class="text-slate-600 text-sm">/</span>
      <span class="text-sm text-slate-300">New BTO Project</span>
    </div>
    <div class="flex gap-2">
      <button class="bg-slate-700 text-slate-300 text-xs px-3 py-1.5 rounded">Save Draft</button>
    </div>
  </div>

  <div class="flex flex-1 overflow-hidden">
    <!-- Sidebar: Step Wizard -->
    <div class="w-56 bg-slate-850 border-r border-slate-700 p-4 shrink-0">
      <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-4">Steps</div>
      <div class="space-y-1">
        <div class="flex items-center gap-2 px-3 py-2 bg-teal-900/30 border-l-2 border-teal-400 rounded-r text-sm">
          <span class="w-5 h-5 bg-teal-500 rounded-full flex items-center justify-center text-[10px] font-bold">✓</span>
          <span class="text-teal-300 font-medium">Project Details</span>
        </div>
        <div class="flex items-center gap-2 px-3 py-2 text-slate-400 text-sm hover:bg-slate-700/30 rounded-r">
          <span class="w-5 h-5 border border-slate-600 rounded-full flex items-center justify-center text-[10px]">2</span>
          <span>Add Flat Model</span>
        </div>
        <div class="flex items-center gap-2 px-3 py-2 text-slate-500 text-sm">
          <span class="w-5 h-5 border border-slate-700 rounded-full flex items-center justify-center text-[10px]">3</span>
          <span>Draw Walls</span>
        </div>
        <div class="flex items-center gap-2 px-3 py-2 text-slate-500 text-sm">
          <span class="w-5 h-5 border border-slate-700 rounded-full flex items-center justify-center text-[10px]">4</span>
          <span>Label Rooms</span>
        </div>
        <div class="flex items-center gap-2 px-3 py-2 text-slate-500 text-sm">
          <span class="w-5 h-5 border border-slate-700 rounded-full flex items-center justify-center text-[10px]">5</span>
          <span>Defaults</span>
        </div>
        <div class="flex items-center gap-2 px-3 py-2 text-slate-500 text-sm">
          <span class="w-5 h-5 border border-slate-700 rounded-full flex items-center justify-center text-[10px]">6</span>
          <span>Preview & Publish</span>
        </div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 p-6 overflow-y-auto">
      <!-- Step 1: Project Details -->
      <div>
        <h2 class="text-lg font-semibold mb-1">Project Details</h2>
        <p class="text-sm text-slate-400 mb-6">Add a new BTO project to the library.</p>

        <div class="grid grid-cols-2 gap-4 max-w-2xl">
          <div class="col-span-2">
            <label class="text-xs text-slate-400 block mb-1">Project Name *</label>
            <input type="text" value="Verandah Kallang 2024" class="w-full bg-slate-700 border border-slate-600 rounded px-3 py-2 text-sm">
          </div>
          <div class="col-span-2">
            <label class="text-xs text-slate-400 block mb-1">Slug *</label>
            <input type="text" value="verandah-kallang-2024" class="w-full bg-slate-700 border border-slate-600 rounded px-3 py-2 text-sm text-slate-400">
          </div>
          <div>
            <label class="text-xs text-slate-400 block mb-1">Location *</label>
            <input type="text" value="Kallang" class="w-full bg-slate-700 border border-slate-600 rounded px-3 py-2 text-sm">
          </div>
          <div>
            <label class="text-xs text-slate-400 block mb-1">Launch Year *</label>
            <select class="w-full bg-slate-700 border border-slate-600 rounded px-3 py-2 text-sm">
              <option selected>2025</option>
              <option>2024</option>
            </select>
          </div>
          <div class="col-span-2">
            <label class="text-xs text-slate-400 block mb-1">Description</label>
            <textarea rows="2" class="w-full bg-slate-700 border border-slate-600 rounded px-3 py-2 text-sm">Premium BTO project in Kallang, near Kallang Riverside Park. 3 flat types available.</textarea>
          </div>
          <div class="col-span-2">
            <label class="text-xs text-slate-400 block mb-1">Hero Image (shown on browse page, 16:9)</label>
            <div class="border-2 border-dashed border-slate-600 rounded-lg p-8 text-center cursor-pointer hover:border-slate-500">
              <div class="text-slate-500 text-2xl mb-1">📁</div>
              <div class="text-slate-500 text-sm">Drop image or click to upload</div>
              <div class="text-slate-600 text-xs mt-1">PNG, JPG · Max 5MB</div>
            </div>
          </div>
        </div>

        <div class="flex gap-3 mt-8">
          <button class="bg-slate-700 text-slate-300 px-4 py-2 rounded text-sm hover:bg-slate-600">Cancel</button>
          <button class="bg-teal-600 text-white px-6 py-2 rounded text-sm font-medium hover:bg-teal-500">Save & Next → Add Flat Model</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
