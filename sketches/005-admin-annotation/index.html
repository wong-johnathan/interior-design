<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Room Annotation</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-800 text-white font-['Inter',system-ui,sans-serif] h-screen flex flex-col overflow-hidden">
  <!-- Top Bar -->
  <div class="flex items-center justify-between px-4 py-2 bg-slate-900 border-b border-slate-700 shrink-0">
    <div class="flex items-center gap-3">
      <span class="text-sm font-bold text-amber-400">⚙️ Admin</span>
      <span class="text-slate-400 text-sm">/</span>
      <span class="text-sm">Verandah Kallang 2024</span>
      <span class="text-xs bg-slate-700 px-2 py-0.5 rounded text-slate-300">4-Room Model A</span>
    </div>
    <div class="flex gap-2">
      <button class="bg-green-600 text-white text-xs px-4 py-1.5 rounded">Publish</button>
      <button class="bg-slate-700 text-slate-300 text-xs px-4 py-1.5 rounded">Save Draft</button>
    </div>
  </div>

  <div class="flex flex-1 overflow-hidden">
    <!-- Canvas Area (70%) -->
    <div class="flex-1 bg-slate-700 relative flex items-center justify-center">
      <!-- Floor plan image placeholder -->
      <div class="relative w-[500px] h-[400px] bg-slate-600 rounded-lg border-2 border-dashed border-slate-500">
        <!-- Drawn rooms overlay -->
        <div class="absolute inset-0">
          <!-- Living Room -->
          <div class="absolute top-10 left-8 w-40 h-32 border-2 border-teal-400 bg-teal-500/10 rounded flex items-center justify-center text-teal-300 text-xs font-medium cursor-pointer hover:bg-teal-500/20">
            Living Room
            <div class="absolute -top-3 -right-3 w-5 h-5 bg-teal-500 rounded-full flex items-center justify-center text-[10px]">◈</div>
          </div>
          <!-- MBR -->
          <div class="absolute top-10 right-8 w-32 h-28 border-2 border-blue-400 bg-blue-500/10 rounded flex items-center justify-center text-blue-300 text-xs font-medium cursor-pointer">
            MBR
          </div>
          <!-- Kitchen -->
          <div class="absolute bottom-12 left-8 w-36 h-24 border-2 border-emerald-400 bg-emerald-500/10 rounded flex items-center justify-center text-emerald-300 text-xs font-medium cursor-pointer">
            Kitchen
          </div>
          <!-- Bomb Shelter -->
          <div class="absolute bottom-12 right-8 w-20 h-16 border-2 border-amber-400 bg-amber-500/10 rounded flex items-center justify-center text-amber-300 text-xs font-medium cursor-pointer">
            Bomb Shelter
          </div>
          <!-- Toilet -->
          <div class="absolute top-44 left-8 w-16 h-16 border-2 border-purple-400 bg-purple-500/10 rounded flex items-center justify-center text-purple-300 text-xs font-medium cursor-pointer">
            Toilet 1
          </div>
          <!-- Door indicator -->
          <div class="absolute top-10 left-[7.5rem] w-4 h-2 bg-amber-400 rounded-full flex items-center justify-center text-[8px]">🚪</div>
          <!-- Window indicator -->
          <div class="absolute top-4 left-20 w-8 h-2 bg-cyan-400 rounded-full"></div>
        </div>
      </div>

      <!-- Toolbar -->
      <div class="absolute bottom-4 left-1/2 -translate-x-1/2 bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 flex gap-2">
        <button class="bg-teal-600 text-white text-xs px-3 py-1.5 rounded">✏️ Draw</button>
        <button class="bg-slate-700 text-slate-300 text-xs px-3 py-1.5 rounded hover:bg-slate-600">✋ Select</button>
        <button class="bg-slate-700 text-slate-300 text-xs px-3 py-1.5 rounded hover:bg-slate-600">🚪 Door</button>
        <button class="bg-slate-700 text-slate-300 text-xs px-3 py-1.5 rounded hover:bg-slate-600">🪟 Window</button>
        <button class="bg-slate-700 text-slate-300 text-xs px-3 py-1.5 rounded hover:bg-slate-600">🗑️ Delete</button>
        <span class="w-px bg-slate-600 mx-1"></span>
        <button class="bg-slate-700 text-slate-300 text-xs px-3 py-1.5 rounded hover:bg-slate-600">🔍+</button>
        <button class="bg-slate-700 text-slate-300 text-xs px-3 py-1.5 rounded hover:bg-slate-600">🔍−</button>
      </div>
    </div>

    <!-- Properties Panel (30%) -->
    <div class="w-80 bg-slate-850 border-l border-slate-700 p-4 overflow-y-auto shrink-0">
      <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-4">Selected: Living Room</div>

      <div class="space-y-3">
        <div>
          <label class="text-xs text-slate-400 block mb-1">Room Type</label>
          <select class="w-full bg-slate-700 border border-slate-600 rounded px-2 py-1.5 text-sm">
            <option selected>Living</option>
            <option>Master Bedroom</option>
            <option>Bedroom</option>
            <option>Kitchen</option>
            <option>Toilet</option>
            <option>Bomb Shelter</option>
            <option>Service Yard</option>
            <option>Hallway</option>
          </select>
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">Label</label>
          <input type="text" value="Living Room" class="w-full bg-slate-700 border border-slate-600 rounded px-2 py-1.5 text-sm">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs text-slate-400 block mb-1">Wall Height (m)</label>
            <input type="number" value="2.8" class="w-full bg-slate-700 border border-slate-600 rounded px-2 py-1.5 text-sm">
          </div>
          <div>
            <label class="text-xs text-slate-400 block mb-1">Floor Type</label>
            <select class="w-full bg-slate-700 border border-slate-600 rounded px-2 py-1.5 text-sm">
              <option selected>Parquet</option>
              <option>Tiles</option>
              <option>Laminate</option>
              <option>Vinyl</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs text-slate-400 block mb-1">Wall Color</label>
            <div class="flex gap-1">
              <input type="color" value="#F5F5F0" class="w-8 h-8 rounded cursor-pointer">
              <input type="text" value="#F5F5F0" class="flex-1 bg-slate-700 border border-slate-600 rounded px-2 py-1.5 text-sm">
            </div>
          </div>
          <div>
            <label class="text-xs text-slate-400 block mb-1">Floor Color</label>
            <input type="text" value="Light Oak" class="w-full bg-slate-700 border border-slate-600 rounded px-2 py-1.5 text-sm">
          </div>
        </div>

        <div class="border-t border-slate-700 pt-3">
          <div class="text-xs text-slate-400 mb-2">Dimensions</div>
          <div class="grid grid-cols-3 gap-2 text-center text-xs">
            <div class="bg-slate-700/50 p-2 rounded">
              <div class="text-slate-400">Width</div>
              <div class="font-medium text-teal-300">5.2m</div>
            </div>
            <div class="bg-slate-700/50 p-2 rounded">
              <div class="text-slate-400">Depth</div>
              <div class="font-medium text-teal-300">4.8m</div>
            </div>
            <div class="bg-slate-700/50 p-2 rounded">
              <div class="text-slate-400">Area</div>
              <div class="font-medium text-teal-300">24.96m²</div>
            </div>
          </div>
        </div>

        <div class="border-t border-slate-700 pt-3">
          <div class="flex justify-between items-center mb-2">
            <span class="text-xs text-slate-400">Doors</span>
            <button class="text-xs text-teal-400 hover:text-teal-300">+ Add</button>
          </div>
          <div class="bg-slate-700/30 p-2 rounded text-xs flex justify-between">
            <span>🚪 W: 0.9m · H: 2.1m</span>
            <span class="text-slate-500">Inward</span>
          </div>
        </div>

        <div class="border-t border-slate-700 pt-3">
          <div class="flex justify-between items-center mb-2">
            <span class="text-xs text-slate-400">Windows</span>
            <button class="text-xs text-teal-400 hover:text-teal-300">+ Add</button>
          </div>
          <div class="bg-slate-700/30 p-2 rounded text-xs flex justify-between">
            <span>🪟 W: 1.2m · H: 1.2m</span>
            <span class="text-slate-500">Sill: 1.0m</span>
          </div>
        </div>

        <div class="border-t border-slate-700 pt-3 flex gap-2">
          <button class="flex-1 bg-red-600/20 text-red-400 text-xs py-1.5 rounded hover:bg-red-600/30">Delete Room</button>
          <button class="flex-1 bg-slate-700 text-slate-300 text-xs py-1.5 rounded">Preview 3D 🏠</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
