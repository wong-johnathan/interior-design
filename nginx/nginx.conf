# ─────────────────────────────────────────────────────────────────────
# nginx — Main Configuration
# HDB Interior Design Web App
# ─────────────────────────────────────────────────────────────────────

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ─── Logging ──────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main buffer=32k flush=5s;

    # ─── Basic Settings ───────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 50M;

    # ─── Gzip Compression ─────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_disable "msie6";
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml
        text/javascript
        image/svg+xml
        application/ld+json
        application/manifest+json
        application/vnd.api+json
        font/woff
        font/woff2;

    # ─── Rate Limiting Zones ──────────────────────────────────────
    # API: 100 requests per minute per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
    # AI endpoints: 20 requests per minute per IP
    limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=20r/m;

    # ─── Security Headers (global) ────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ─── Upstreams ────────────────────────────────────────────────
    upstream frontend {
        server frontend:3000;
        keepalive 64;
    }

    upstream backend {
        server backend:4000;
        keepalive 64;
    }

    # ─── HTTP → HTTPS Redirect ────────────────────────────────────
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ─── HTTPS Server ─────────────────────────────────────────────
    server {
        listen 443 ssl http2 default_server;
        listen [::]:443 ssl http2 default_server;
        server_name _;

        # SSL (self-signed for dev; use Let's Encrypt in production)
        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # ─── Static Assets (immutable cache) ─────────────────────
        location /_next/static {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Cache for 1 year (Next.js uses content hashes)
            add_header Cache-Control "public, immutable, max-age=31536000";
            expires 1y;
        }

        location /static {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header Cache-Control "public, immutable, max-age=31536000";
            expires 1y;
        }

        # ─── WebSocket (HMR in dev, future use) ──────────────────
        location /_next/webpack-hmr {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
        }

        # ─── API Backend ─────────────────────────────────────────
        location /api/ {
            # Rate limiting
            limit_req zone=api_limit burst=20 nodelay;

            # Stricter rate limit for AI endpoints
            location ~* ^/api/(ai|render)/ {
                limit_req zone=ai_limit burst=5 nodelay;
                proxy_pass http://backend;
            }

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # No caching for API responses
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
            proxy_cache off;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            expires off;

            # Timeouts — extended for AI streaming (Gemini)
            proxy_connect_timeout 10s;
            proxy_send_timeout    30s;
            proxy_read_timeout    60s;

            # Large body for render/image requests
            client_max_body_size 50M;
            client_body_buffer_size 128k;
        }

        # ─── Health Check Endpoint (via backend) ───────────────────
        location /health {
            proxy_pass http://backend/api/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            access_log off;
            proxy_cache off;
        }

        # ─── Frontend (SSR — catch all) ──────────────────────────
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # No caching for SSR pages
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires off;

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }
    }
}
