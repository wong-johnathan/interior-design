# Docker Compose - HDB Interior Design (Local Dev)
# Standalone dev config. No .env needed - all defaults pre-filled.
# Usage: docker compose -f docker-compose.dev.yml up -d

name: hdb-interior-design-dev

networks:
  hdb-net:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local
  pgadmin-data:
    driver: local

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: hdb-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/next.config.ts:/app/next.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tailwind.config.ts:/app/tailwind.config.ts
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - NEXTAUTH_SECRET=local-dev-secret-for-development-only
      - NEXTAUTH_URL=http://localhost:3000
      - AUTH_GOOGLE_ID=dev-placeholder-id
      - AUTH_GOOGLE_SECRET=dev-placeholder-secret
      - BACKEND_INTERNAL_URL=http://backend:4000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hdb-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: hdb-backend
    ports:
      - "4000:4000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - ./backend/tsconfig.json:/app/tsconfig.json
    environment:
      - NODE_ENV=development
      - PORT=4000
      - HOSTNAME=0.0.0.0
      - CORS_ORIGIN=http://localhost:3000
      - APP_URL=http://localhost:3000
      - DATABASE_URL=postgresql://hdb_app:changeme@postgres:5432/hdb_interior_design?schema=public
      - DIRECT_URL=postgresql://hdb_app:changeme@postgres:5432/hdb_interior_design?schema=public
      - REDIS_URL=redis://:changeme@redis:6379
      - REDIS_PASSWORD=changeme
      - NEXTAUTH_SECRET=local-dev-secret-for-development-only
      - AUTH_GOOGLE_ID=dev-placeholder-id
      - AUTH_GOOGLE_SECRET=dev-placeholder-secret
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=gemini-2.5-pro
      - R2_ENDPOINT=http://minio:9000
      - R2_REGION=auto
      - R2_ACCESS_KEY_ID=minioadmin
      - R2_SECRET_ACCESS_KEY=minioadmin
      - R2_BUCKET_NAME=hdb-interior-design
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hdb-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:16
    container_name: hdb-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=hdb_app
      - POSTGRES_PASSWORD=changeme
      - POSTGRES_DB=hdb_interior_design
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - hdb-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hdb_app -d hdb_interior_design"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: hdb-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "changeme", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - hdb-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "changeme", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  minio:
    image: minio/minio:latest
    container_name: hdb-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - hdb-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: hdb-pgadmin
    ports:
      - "5050:5050"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@hdb-interior.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hdb-net
    restart: unless-stopped
